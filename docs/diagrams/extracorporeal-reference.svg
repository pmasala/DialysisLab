<text x="58" y="595" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203246" font-weight="700" text-anchor="start">How to read this drawing</text>
<text x="58" y="621" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#203246" font-weight="400" text-anchor="start">Select pre- OR postdilution for HDF; neither inlet supplies substitution in HD.</text>
<text x="58" y="646" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#203246" font-weight="400" text-anchor="start">The default solver collapses the blood path to one pressure node and one dialyzer resistance.</text>
<text x="58" y="671" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#203246" font-weight="400" text-anchor="start">Tubing sections and the dialysate counterflow route are illustrative, not spatially resolved.</text>
<text x="58" y="696" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#203246" font-weight="400" text-anchor="start">No separate air trap, bubble transport or arterial/venous pressure network is implemented.</text>
</svg>
