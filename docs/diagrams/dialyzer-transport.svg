<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img">
<title>Dialyzer — membrane transport model</title>
<desc>Cross-section illustration; the implementation uses mixed pools, not resolved hollow-fibre geometry.</desc>
<rect width="1200" height="100%" fill="#ffffff"/>
<text x="40" y="45" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#203246" font-weight="700" text-anchor="start">Dialyzer — membrane transport model</text>
<text x="40" y="75" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#637589" font-weight="400" text-anchor="start">Cross-section illustration; the implementation uses mixed pools, not resolved hollow-fibre geometry.</text>
<path d="M40,96 L1160,96" stroke="#d6dfe7" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M225,205 h750 v300 h-750 Z" stroke="#203246" stroke-width="2" fill="#fafbfc" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M226,206 h748 v136 h-748 Z" stroke="#faedef" stroke-width="2" fill="#faedef" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M226,369 h748 v135 h-748 Z" stroke="#eaf5f8" stroke-width="2" fill="#eaf5f8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M225,345 L975,345" stroke="#637589" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M225,366 L975,366" stroke="#637589" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M65,265 H225 M975,265 H1135" stroke="#ad3248" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M1135,438 H975 M225,438 H65" stroke="#19718b" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M165,260 L175,265 L165,270" stroke="#ad3248" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M1090,260 L1100,265 L1090,270" stroke="#ad3248" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M1040,433 L1030,438 L1040,443" stroke="#19718b" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M115,433 L105,438 L115,443" stroke="#19718b" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="245" y="185" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#ad3248" font-weight="700" text-anchor="start">Blood side: one mixed extracorporeal pool</text>
<text x="245" y="535" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#19718b" font-weight="700" text-anchor="start">Dialysate side: specified flow Qd and composition Cd</text>
<text x="65" y="239" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#ad3248" font-weight="400" text-anchor="start">Qb, Cb</text>
<text x="1010" y="239" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#ad3248" font-weight="400" text-anchor="start">Blood return</text>
<text x="1005" y="473" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#19718b" font-weight="400" text-anchor="start">Fresh fluid</text>
<text x="60" y="473" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#19718b" font-weight="400" text-anchor="start">Spent fluid</text>
<path d="M415,305 L415,405" stroke="#7960a6" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M410,315 L415,305 L420,315" stroke="#7960a6" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M410,395 L415,405 L420,395" stroke="#7960a6" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="415" y="285" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#7960a6" font-weight="700" text-anchor="middle">Diffusion</text>
<text x="415" y="462" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#7960a6" font-weight="400" text-anchor="middle">K × (Cb − Cd)</text>
<path d="M755,305 L755,405" stroke="#19718b" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M750,395 L755,405 L760,395" stroke="#19718b" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="755" y="285" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#19718b" font-weight="700" text-anchor="middle">Water + convection</text>
<text x="755" y="462" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#19718b" font-weight="400" text-anchor="middle">Quf × sieving × Cb</text>
<text x="580" y="361" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#637589" font-weight="400" text-anchor="middle">Membrane</text>
<path d="M40,574 h1120 v113 h-1120 Z" stroke="#d6dfe7" stroke-width="2" fill="#f4f7fa" stroke-linejoin="round" stroke-linecap="round"/>
<text x="58" y="601" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203246" font-weight="700" text-anchor="start">Reading the symbols</text>
<text x="58" y="627" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#203246" font-weight="400" text-anchor="start">Opposed ports illustrate the treatment route; there is no axial or countercurrent concentration solver.</text>
<text x="58" y="652" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#203246" font-weight="400" text-anchor="start">Diffusion can reverse with concentration gradient. Water removal is separately limited by pressure.</text>
<text x="58" y="677" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#203246" font-weight="400" text-anchor="start">Expressions show proportionality; implementation uses explicit mL-to-L conversions for solute flux.</text>
</svg>
