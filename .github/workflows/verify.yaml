name: Simulator software verification
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_long:
        description: Run the separate 100000-step endurance campaign
        type: boolean
        default: false
      long_timeout_seconds:
        description: Wall-clock budget per endurance repetition
        type: choice
        options: ["3600", "7200"]
        default: "7200"
permissions:
  contents: read
concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fetch the exact public event revision with system Git
        env:
          GIT_TERMINAL_PROMPT: "0"
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -eu
          test -n "$GITHUB_REPOSITORY"
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -c protocol.file.allow=never fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git -c filter.lfs.smudge= -c filter.lfs.required=false checkout --detach "$GITHUB_SHA"
          git --version
      - name: Build and exercise actual software
        run: python3 tools/ci_verify.py --output build/ci
      - name: Preserve identified reports in job logs and summary
        if: always()
        run: python3 tools/ci_verify.py --output build/ci --report-only
  dynamic-resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Fetch the exact public event revision with system Git
        env:
          GIT_TERMINAL_PROMPT: "0"
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -eu
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -c protocol.file.allow=never fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git -c filter.lfs.smudge= -c filter.lfs.required=false checkout --detach "$GITHUB_SHA"
      - name: Build the current core and isolated services
        run: |
          cmake -S . -B build/dynamic-native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/dynamic-native --parallel 3
          docker compose build
      - name: Verify two full HDF lifecycles with ten simulated therapy minutes
        run: python3 tools/verify_integrated.py --group dynamic-short --compose --build-dir build/dynamic-native --output build/dynamic-resources --archive
      - name: Retain distributed resource evidence even on failure
        if: always()
        run: python3 tools/retain_dynamic_resources.py --root build/dynamic-resources
  dynamic-endurance:
    if: github.event_name == 'workflow_dispatch' && inputs.run_long
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Fetch the exact public event revision with system Git
        env:
          GIT_TERMINAL_PROMPT: "0"
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -eu
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -c protocol.file.allow=never fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git -c filter.lfs.smudge= -c filter.lfs.required=false checkout --detach "$GITHUB_SHA"
      - name: Build the current core and isolated services
        run: |
          cmake -S . -B build/dynamic-native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/dynamic-native --parallel 3
          docker compose build
      - name: Measure two 100000-step distributed HDF runs
        env:
          LONG_TIMEOUT_SECONDS: ${{ inputs.long_timeout_seconds }}
        run: python3 tools/verify_integrated.py --group dynamic-long --compose --compose-timeout "$LONG_TIMEOUT_SECONDS" --build-dir build/dynamic-native --output build/dynamic-resources --archive
      - name: Retain distributed resource evidence even on failure
        if: always()
        run: python3 tools/retain_dynamic_resources.py --root build/dynamic-resources
