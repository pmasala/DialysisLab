name: dialysislab-m1
x-common: &common
  image: dialysislab-m1:local
  platform: linux/amd64
  network_mode: none
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 32
  mem_limit: 128m
  cpus: 1
  restart: "no"
  stop_grace_period: 3s
services:
  plant:
    <<: *common
    build:
      context: .
      target: runtime
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unavailable}
    command: [/opt/bin/plant, --runtime-dir, /run/dialysis]
    volumes:
      - admin:/run/dialysis/admin
      - control:/run/dialysis/control
      - protection:/run/dialysis/protection
  control:
    <<: *common
    command: [/opt/bin/control, --runtime-dir, /run/dialysis]
    volumes: [control:/run/dialysis/control, device-control:/run/dialysis/device/control]
  protection:
    <<: *common
    command: [/opt/bin/protection, --runtime-dir, /run/dialysis]
    volumes: [protection:/run/dialysis/protection, device-protection:/run/dialysis/device/protection]
  patient:
    <<: *common
    command: [python3, -m, dialysislab.patient, --runtime-dir, /run/dialysis]
    volumes: [patient:/run/dialysis/patient]
  runner:
    <<: *common
    depends_on: [plant, control, protection, patient]
    command: [python3, -m, dialysislab.runner, --config, "/opt/dialysislab/scenarios/${SCENARIO:-hd_occlusion}.json", --output, "/results/${RUN_NAME:-run}", --build-dir, /opt/bin, --wall-speed, "${WALL_SPEED:-0}"]
    volumes:
      - admin:/run/dialysis/admin
      - control:/run/dialysis/control
      - protection:/run/dialysis/protection
      - patient:/run/dialysis/patient
      - device-control:/run/dialysis/device/control:ro
      - device-protection:/run/dialysis/device/protection:ro
      - results:/results
  device-ui:
    <<: *common
    image: dialysislab-ui:local
    profiles: [device-ui]
    build:
      context: .
      target: gui-runtime
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unavailable}
    command: [/opt/bin/device-ui, --headless, --runtime-dir, /run/dialysis, --capture-dir, /captures]
    volumes: ["device-control:/run/dialysis/device/control:ro", "device-protection:/run/dialysis/device/protection:ro", "captures:/captures"]
volumes:
  captures:
  admin:
  control:
  protection:
  patient:
  results:
  device-control:
  device-protection:
