<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DialysisLab · Browser</title>
<style>body{margin:0;background:#eff6f8;color:#142d4e;font:16px system-ui}header,aside{max-width:1100px;margin:auto;padding:12px;box-sizing:border-box}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:22px;margin:0}button,select{min-height:44px;padding:8px 14px;font:inherit;border:1px solid #b9d2df;border-radius:8px;background:white;color:#142d4e}button{cursor:pointer}button:disabled{opacity:.5}#run{background:#087f8c;color:white}#screen{overflow:auto;max-width:1100px;margin:auto}canvas{display:block;width:1100px;height:890px;touch-action:none}p{margin:5px 0}#error{color:#9c1d39;white-space:pre-wrap}small{color:#49677d}label{display:flex;align-items:center;gap:5px}</style></head>
<body><header><h1>DialysisLab / Browser</h1><select id="mode" aria-label="Modalità"><option>HD</option><option>HDF_PRE</option><option>HDF_POST</option></select><button id="reset">Nuova simulazione</button><button id="run" disabled>Avvia tempo</button><label><input type="checkbox" id="auto">Ciclo automatico</label><select id="speed" aria-label="Velocità"><option value="1">1×</option><option value="20" selected>20×</option><option value="100">100×</option></select><button id="export" disabled>Esporta stato</button></header>
<aside><p id="status">Caricamento UI e runtime locali…</p><small>Ciclo dimostrativo: 60 s di trattamento. C++/LVGL e paziente Python eseguiti sul dispositivo. Solo simulazione.</small><p id="patient"></p><p id="error" role="alert"></p></aside>
<div id="screen"><canvas id="canvas" width="1100" height="890" tabindex="0" aria-label="Interfaccia LVGL del simulatore"></canvas></div><aside><small id="identity"></small></aside>
<script src="ui.js"></script><script src="app.js?v=20261017-manual1"></script></body></html>
